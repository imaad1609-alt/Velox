<!-- Atmospheric Light Interaction Script -->
<script>
    document.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;
      
      const background = document.querySelector('.fixed.inset-0 div:first-child');
      if (background) {
        background.style.transform = `translate(${mouseX * 10}px, ${mouseY * 10}px) scale(1.05)`;
        background.style.transition = 'transform 0.2s ease-out';
      }
    });

    // Simple interaction feedback for buttons
    const buttons = document.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
      btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
      btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
    });
  </script>
